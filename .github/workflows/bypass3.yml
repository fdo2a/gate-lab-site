name: bypass attempts 3 (lab)
on:
  workflow_run:
    workflows: ["bypass attempts 2 (lab)"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - uses: actions/deploy-pages@v4
