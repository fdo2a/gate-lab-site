name: bypass attempts (lab)
# 원본 저장소 안에서 자동 작업을 만들어 문지기를 건너뛰려는 시도 — 전부 거부돼야 한다.
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
jobs:
  push-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A. GITHUB_TOKEN 으로 site 가지에 직접 푸시
        run: |
          if git push origin HEAD:site 2>&1 | tee /tmp/a.txt | grep -q "GH013\|rejected\|declined"; then echo "RESULT A: REJECTED"; else echo "RESULT A: ACCEPTED"; cat /tmp/a.txt; fi
      - name: B. GITHUB_TOKEN 으로 site 가지 규칙 삭제 시도
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ID=$(gh api repos/${{ github.repository }}/rulesets --jq '.[0].id' 2>/dev/null || echo 0)
          code=$(curl -s -o /tmp/b.txt -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/rulesets/$ID)
          echo "RESULT B: HTTP $code"
      - name: C. GITHUB_TOKEN 으로 Pages 출처를 main 으로 바꾸기 시도
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          code=$(curl -s -o /tmp/c.txt -w '%{http_code}' -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages -d '{"source":{"branch":"main","path":"/"}}')
          echo "RESULT C: HTTP $code $(head -c 160 /tmp/c.txt)"
      - name: D. GITHUB_TOKEN 으로 배포 열쇠 추가 시도
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          code=$(curl -s -o /tmp/d.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/keys -d '{"title":"x","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ6d0b0k0n1h3m5q7s9u1w3y5A7C9E1G3I5K7M9O1Q3S x","read_only":false}')
          echo "RESULT D: HTTP $code"
  deploy-pages:
    # E. Pages 를 Actions 방식으로 직접 배포 시도(출처는 가지 방식으로 설정돼 있다)
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - run: echo "RESULT E deploy-pages outcome=${{ steps.d.outcome }}"
